- name: Weekly Windows Update
  hosts: windows_clients
  gather_facts: false
  serial: 7
  max_fail_percentage: 30        # Fail only if more than 30%
  any_errors_fatal: false

  tasks:
    - name: Install updates from Microsoft Update
      ansible.windows.win_updates:
        server_selection: windows_update
        category_names:
          - SecurityUpdates
          - CriticalUpdates
          - UpdateRollups
          - DefinitionUpdates
          - Updates
        # - Drivers
        reboot: true
        reboot_timeout: 1000
      register: update_result

    - name: Show summary
        ansible.builtin.debug:
        msg:
          - "Installed: {{ update_result.installed_update_count }}"
          - "Failed: {{ update_result.failed_update_count }}"
          - "Reboot performed: {{ update_result.reboot_required }}"

    - name: Always reboot after Windows Update
      ansible.windows.win_reboot:
        msg: "full reboot Windows"
        pre_reboot_delay: 60
        reboot_timeout: 1800
        post_reboot_delay: 60
      ignore_errors: true
